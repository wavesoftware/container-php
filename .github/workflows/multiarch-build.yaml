name: Multiarch build

on: 
  push:
    branches:
      - '**'
  schedule:
  # Every month's 2nd on 5:30
  - cron: '30 5 2 * *'
  workflow_dispatch: {} # allow manual trigger

jobs:
  multiarch-build:
    name: Build images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install qemu dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Buildah Action
        id: build-image
        uses: redhat-actions/buildah-build@3f7ef4f0e61d6d1def3bf4fdd77798afca03428b # main; v3.1.0 has a broken inspect template (fixed upstream in https://github.com/redhat-actions/buildah-build/pull/207), switch back to @v3 once released
        with:
          image: php
          tags: latest
          platforms: linux/amd64, linux/arm64
          containerfiles: Containerfile

      - name: Push To quay.io
        id: push-to-quay
        uses: redhat-actions/push-to-registry@v3
        if: github.ref == 'refs/heads/master'
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: quay.io/wavesoftware
          username: ${{ secrets.QUAY_USER }}
          password: ${{ secrets.QUAY_PASSWORD }}
