name: Multiarch build

on: 
  push:
    branches:
      - '**'
  schedule:
  # Every month's 2nd on 5:30
  - cron: '30 5 2 * *'
  workflow_dispatch: {} # allow manual trigger

jobs:
  multiarch-build:
    name: Build images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install qemu dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Buildah Action
        id: build-image
        uses: redhat-actions/buildah-build@v3
        with:
          # Fully qualified names: push-to-registry@v3 looks the local manifest
          # up as "localhost/<image>:<tag>" (run 39996644389 failed with
          # "localhost/php:latest: image not known" for an unqualified "php").
          # "1h" is the ttl.sh retention tag used for non-master verification.
          tags: localhost/php:latest localhost/php:1h
          platforms: linux/amd64, linux/arm64
          containerfiles: Containerfile

      - name: Push To quay.io
        id: push-to-quay
        uses: redhat-actions/push-to-registry@v3
        if: github.ref == 'refs/heads/master'
        with:
          image: php
          tags: latest
          registry: quay.io/wavesoftware
          username: ${{ secrets.QUAY_USER }}
          password: ${{ secrets.QUAY_PASSWORD }}

      # Outside master, push to the anonymous, ephemeral ttl.sh registry so the
      # push path is verified on every branch without touching quay.io.
      - name: Push To ttl.sh
        id: push-to-ttl
        uses: redhat-actions/push-to-registry@v3
        if: github.ref != 'refs/heads/master'
        with:
          image: php
          tags: 1h
          registry: ttl.sh/wavesoftware
