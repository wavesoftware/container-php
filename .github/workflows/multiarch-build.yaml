name: Multiarch build

on: 
  push:
    branches:
      - master
  pull_request: {} # PR builds are tagged pr-<number>
  schedule:
  # Every month's 2nd on 5:30
  - cron: '30 5 2 * *'
  workflow_dispatch: {} # allow manual trigger

env:
  # master publishes :latest, PRs publish :pr-<number> so parallel PRs don't interfere
  TAG: ${{ github.ref == 'refs/heads/master' && 'latest' || format('pr-{0}', github.event.number || github.run_id) }}
  # master publishes to quay.io, other refs to the ephemeral ttl.sh registry
  REGISTRY: ${{ github.ref == 'refs/heads/master' && 'quay.io/wavesoftware' || 'ttl.sh/wavesoftware' }}

jobs:
  build:
    name: Build ${{ matrix.arch }} image
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      # Native build on each architecture, no QEMU emulation needed
      - name: Buildah Action
        id: build-image
        uses: redhat-actions/buildah-build@v3
        with:
          tags: localhost/php:${{ env.TAG }}-${{ matrix.arch }}
          platforms: linux/${{ matrix.arch }}
          containerfiles: Containerfile

      - name: Push per-arch image
        id: push-image
        uses: redhat-actions/push-to-registry@v3
        with:
          image: php
          tags: ${{ env.TAG }}-${{ matrix.arch }}
          registry: ${{ env.REGISTRY }}
          username: ${{ github.ref == 'refs/heads/master' && secrets.QUAY_USER || '' }}
          password: ${{ github.ref == 'refs/heads/master' && secrets.QUAY_PASSWORD || '' }}

  manifest:
    name: Combine into multi-arch image
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Log in to quay.io
        if: github.ref == 'refs/heads/master'
        env:
          QUAY_USER: ${{ secrets.QUAY_USER }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          buildah login --username "${QUAY_USER}" --password-stdin quay.io <<< "${QUAY_PASSWORD}"

      - name: Create and push manifest list
        run: |
          set -euo pipefail
          image="${REGISTRY}/php"
          buildah manifest create php:${TAG}
          for arch in amd64 arm64; do
            buildah manifest add php:${TAG} "docker://${image}:${TAG}-${arch}"
          done
          count=$(buildah manifest inspect php:${TAG} | jq '.manifests | length')
          if [ "${count}" -ne 2 ]; then
            echo "::error::Expected 2 images in manifest, found ${count}"
            buildah manifest inspect php:${TAG}
            exit 1
          fi
          buildah manifest push --all php:${TAG} "docker://${image}:${TAG}"
